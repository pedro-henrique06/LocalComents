name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  vsix:
    name: Build VSIX
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild LocalComents.csproj -t:Restore -p:Configuration=Release -v:minimal

      # DeployExtension is on in the project so F5 works locally; on the runner there is no
      # Visual Studio instance to deploy into.
      - name: Build
        run: msbuild LocalComents.csproj -t:Build -p:Configuration=Release -p:DeployExtension=false -v:minimal

      # The VSSDK output groups strip assemblies Visual Studio itself ships. That filtering is
      # bypassed by the AddMcpServerToVsix target, because the MCP server runs out-of-process and
      # cannot resolve anything from the IDE's folders. A VSIX missing these still installs
      # cleanly and only fails when the server is launched, so assert on the contents here.
      #
      # mermaid.min.js is in the same boat: dropped from the package, the extension installs and
      # only the diagram window breaks, at the moment someone opens it.
      #
      # So are the WebView2 assemblies. Referencing them compile-time only produced a VSIX that
      # built clean and could not load the types on a user's machine — the failure this assertion
      # exists to catch, one build earlier.
      - name: Verify the MCP server is packaged
        shell: pwsh
        run: |
          $vsix = Resolve-Path 'bin/Release/net472/LocalComents.vsix'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          try {
            $entries = $archive.Entries.FullName
          } finally {
            $archive.Dispose()
          }

          $required = @(
            'extension.vsixmanifest',
            'MCP/LocalComents.Mcp.exe',
            'MCP/LocalComents.Mcp.exe.config',
            'MCP/ModelContextProtocol.dll',
            'MCP/ModelContextProtocol.Core.dll',
            'MCP/Newtonsoft.Json.dll',
            'MCP/System.Text.Json.dll',
            'WebView/mermaid.min.js',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll'
          )

          $missing = $required | Where-Object { $entries -notcontains $_ }
          if ($missing) {
            Write-Host "VSIX entries ($($entries.Count)):"
            $entries | Sort-Object | ForEach-Object { Write-Host "  $_" }
            throw "Missing from the VSIX: $($missing -join ', ')"
          }

          Write-Host "OK - $($entries.Count) entries, MCP server packaged with its dependencies."

      # The artifact name carries the version, because the one thing you need to know when
      # picking a build off the Actions list is which release it is -- and every run otherwise
      # produces an identically named artifact.
      - name: Read the packaged version
        id: vsix
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content 'source.extension.vsixmanifest'
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          if (-not $version) { throw 'No version found in source.extension.vsixmanifest.' }
          $short = "${{ github.sha }}".Substring(0, 7)
          Write-Host "Packaged version: $version ($short)"
          "name=LocalComents-$version-$short" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.name }}
          path: bin/Release/net472/LocalComents.vsix
          if-no-files-found: error
